name: IVEX07Order
options:
  bundleIdPrefix: com.ivex07
  deploymentTarget:
    iOS: "17.0"
  settings:
    base:
      SWIFT_VERSION: "6.0"
      DEVELOPMENT_TEAM: ""
targets:
  IVEX07Order:
    type: application
    platform: iOS
    sources:
      - Sources/IVEX07Order
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivex07.order
        PRODUCT_NAME: IVEX07 Order
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: IVEX07 Order
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: IVEX07 Order използва снимките само към избрания продукт.
        INFOPLIST_KEY_NSCameraUsageDescription: IVEX07 Order използва камерата за снимка на продукт или визитка.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
