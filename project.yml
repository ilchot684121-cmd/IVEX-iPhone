name: IVEX07Order
options:
  bundleIdPrefix: com.ivex07
  deploymentTarget:
    iOS: "17.0"
  settings:
    base:
      SWIFT_VERSION: "6.0"
      DEVELOPMENT_TEAM: ""
targets:
  IVEX07Order:
    type: application
    platform: iOS
    sources:
      - Sources/IVEX07Order
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivex07.order
        PRODUCT_NAME: IVEX07 Order
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
